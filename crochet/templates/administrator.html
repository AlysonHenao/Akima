<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin - Akima</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
    
    <div class="text-center mb-5">
        <a href="/" class="text-muted text-decoration-none mb-3 d-inline-block">
            <i class="bi bi-arrow-left"></i> Volver a la tienda
        </a>
        <h1 class="display-4 fw-bold">Akima</h1>
        <p class="text-muted fs-5">Panel de Administración</p>
    </div>

    <div class="row justify-content-center g-4">
        
        <div class="col-md-5 col-lg-4">
            <a href="{% url 'new_product' %}" class="text-decoration-none">
                <div class="card border-0 shadow-sm h-100 text-center p-4">
                    <div class="card-body">
                        <h4 class="card-title text-dark">Productos</h4>
                        <p class="card-text text-muted">Crear y gestionar productos del catálogo</p>
                    </div>
                </div>
            </a>
        </div>

        <div class="col-md-5 col-lg-4">
            <a href="{% url 'orders' %}" class="text-decoration-none">
                <div class="card border-0 shadow-sm h-100 text-center p-4">
                    <div class="card-body">
                        <h4 class="card-title text-dark">Órdenes</h4>
                        <p class="card-text text-muted">Ver y administrar pedidos de clientes</p>
                    </div>
                </div>
            </a>
        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
