<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Akima</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">
  <h1 class="text-center mb-5">Akima</h1>

  <div class="d-flex flex-wrap justify-content-center gap-4">
    {% for producto in productos %}
      <div class="mb-4 d-flex">

        <!-- TODA LA CARD ES CLICKEABLE -->
        <a href="{% url 'producto_detalle' producto.id %}" 
           class="text-decoration-none text-dark">

          <div class="card shadow-sm h-100" 
               style="width: 300px; cursor: pointer; transition: 0.2s;">

            {% with img=producto.imagenes.first %}
              {% if img %}
                <img src="{{ img.url_imagen.url }}" 
                     class="card-img-top" 
                     alt="{{ producto.nombre }}"
                     style="height: 220px; object-fit: cover;">
              {% else %}
                <div class="d-flex align-items-center justify-content-center bg-light" 
                     style="height: 220px;">
                  <span class="text-muted">Sin imagen</span>
                </div>
              {% endif %}
            {% endwith %}

            <div class="card-body d-flex flex-column">
              <h5 class="card-title">{{ producto.nombre }}</h5>

              <p class="card-text">
                {{ producto.descripcion|truncatewords:20 }}
              </p>

              <p class="fw-bold mt-auto">
                ${{ producto.precio }}
              </p>
            </div>

          </div>

        </a>

      </div>
    {% empty %}
      <p class="text-center">No hay productos disponibles.</p>
    {% endfor %}
  </div>

</div>

</body>
</html>
