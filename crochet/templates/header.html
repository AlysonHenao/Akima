<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Akima{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    {% block extra_css %}{% endblock %}
</head>
<body>

<header class="container py-3" style="background-color: rgb(249, 228, 237); color: rgb(60, 35, 2);">
    <div class="d-flex align-items-center justify-content-between">
        <a href="/" class="text-decoration-none" style="color: rgb(60, 35, 2);">
            <i></i> Inicio
        </a>

        <h1 class="mb-0 text-center flex-grow-1">Akima</h1>

        <a href="{% url 'view_cart' %}" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-cart"></i> Carrito
        </a>
    </div>
</header>

<main>
    {% block content %}{% endblock %}
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
{% block extra_js %}{% endblock %}

</body>
</html>
