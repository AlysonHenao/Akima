<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title> {{ product.name }} </title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }
        
        .card {
            width: 450px;
            margin: 60px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0px 10px 25px rgba(0,0,0,0.1);
        }

        .product-image {
            width: 100%;
            border-radius: 10px;
        }

        .product-title {
            margin-top: 15px;
            font-size: 24px;
        }

        .description {
            color: #333;
            line-height: 1.5;
            margin-bottom: 15px;
        }

        .price {
            font-size: 28px;
            font-weight: bold;
            color: #000;
            margin: 15px 0;
        }

        .option-section {
            margin: 20px 0;
        }

        .option-label {
            font-size: 14px;
            font-weight: bold;
            color: #000;
            margin-bottom: 8px;
            display: block;
        }

        .size-selector {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 15px;
            background-color: white;
            cursor: pointer;
            transition: border-color 0.3s;
        }

        .size-selector:hover {
            border-color: #333;
        }

        .size-selector:focus {
            outline: none;
            border-color: #333;
        }

        .color-options {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .color-option {
            padding: 8px 16px;
            border: 2px solid #ddd;
            border-radius: 6px;
            background-color: white;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
        }

        .color-option:hover {
            border-color: #333;
            transform: translateY(-2px);
        }

        .color-option.selected {
            background-color: #333;
            color: white;
            border-color: #333;
        }

        .buy-button {
            width: 100%;
            padding: 14px;
            margin-top: 20px;
            border: none;
            border-radius: 8px;
            background-color: #000;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .buy-button:hover {
            background-color: #333;
            transform: translateY(-2px);
            box-shadow: 0px 5px 15px rgba(0, 0, 0, 0.3);
        }

        .buy-button:active {
            transform: translateY(0);
        }

        .buy-button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .success-message {
            padding: 10px;
            margin-top: 15px;
            background-color: #e8e8e8;
            color: #000;
            border: 1px solid #ccc;
            border-radius: 6px;
            text-align: center;
            display: none;
        }

        .error-message {
            padding: 10px;
            margin-top: 15px;
            background-color: #e8e8e8;
            color: #000;
            border: 1px solid #ccc;
            border-radius: 6px;
            text-align: center;
            display: none;
        }

        .stock-info {
            font-size: 13px;
            color: #333;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="card">
        <img src="{{ product.image.url }}" alt="{{ product.name }}" class="product-image">
        <h2 class="product-title">{{ product.name }}</h2>
        <p class="description">{{ product.description }}</p>
        <p class="price">${{ product.price }}</p>
        
        <div class="option-section">
            <label class="option-label">Size:</label>
            <select class="size-selector" id="size-select">
                <option value="">Select a size</option>
                {% for size in available_sizes %}
                    <option value="{{ size }}">{{ size }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="option-section">
            <label class="option-label">Color:</label>
            <div class="color-options" id="color-options">
                {% for color in available_colors %}
                    <div class="color-option" data-color="{{ color }}">
                        {{ color }}
                    </div>
                {% endfor %}
            </div>
        </div>

        <div class="stock-info">
            Stock available: {{ product.stock }} units
        </div>

        <button class="buy-button" id="add-to-cart-btn" data-product-id="{{ product.id }}" onclick="addToCart()">Add to Cart</button>
        
        <div class="success-message" id="success-message"></div>
        <div class="error-message" id="error-message"></div>
    </div>
    
    <script>
        const colorOptions = document.querySelectorAll('.color-option');
        let selectedColor = null;

        colorOptions.forEach(option => {
            option.addEventListener('click', function() {
                colorOptions.forEach(opt => opt.classList.remove('selected'));
                this.classList.add('selected');
                selectedColor = this.dataset.color;
            });
        });

        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }

        function showMessage(type, message) {
            const successMsg = document.getElementById('success-message');
            const errorMsg = document.getElementById('error-message');
            
            successMsg.style.display = 'none';
            errorMsg.style.display = 'none';
            
            if (type === 'success') {
                successMsg.textContent = message;
                successMsg.style.display = 'block';
                setTimeout(() => {
                    successMsg.style.display = 'none';
                }, 3000);
            } else {
                errorMsg.textContent = message;
                errorMsg.style.display = 'block';
            }
        }

        async function addToCart() {
            const selectedSize = document.getElementById('size-select').value;
            const addButton = document.getElementById('add-to-cart-btn');
            const productId = addButton.dataset.productId;
            
            if (!selectedSize) {
                showMessage('error', 'Please select a size');
                return;
            }
            
            if (!selectedColor) {
                showMessage('error', 'Please select a color');
                return;
            }

            addButton.disabled = true;
            addButton.textContent = 'Adding...';

            try {
                const csrftoken = getCookie('csrftoken');
                const response = await fetch('/cart/add/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': csrftoken
                    },
                    body: JSON.stringify({
                        product_id: productId,
                        size: selectedSize,
                        color: selectedColor,
                        quantity: 1
                    })
                });

                const data = await response.json();

                if (data.success) {
                    showMessage('success', data.message);
                    addButton.textContent = '✓ Added';
                    setTimeout(() => {
                        addButton.textContent = 'Add to Cart';
                    }, 2000);
                } else {
                    showMessage('error', data.message);
                    addButton.textContent = 'Add to Cart';
                }
            } catch (error) {
                showMessage('error', 'Error adding to cart');
                addButton.textContent = 'Add to Cart';
            } finally {
                addButton.disabled = false;
            }
        }
    </script>
</body>
</html>
