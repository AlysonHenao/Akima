<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - Akima</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root { --akima-pink: #f9e4ed; --akima-brown: #3a270de0; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--akima-pink);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .btn-akima { background-color: var(--akima-brown); color: white; border-radius: 20px; }
        .btn-akima:hover { background-color: #5a3a0a; color: white; }
        .form-control:focus { border-color: #e58ab0; box-shadow: 0 0 0 0.2rem rgba(229,138,176,0.25); }
        main { flex: 1; }
    </style>
</head>
<body>

<nav class="bg-white px-4 py-3 d-flex justify-content-between align-items-center"
     style="box-shadow: 0 1px 6px rgba(0,0,0,0.07);">
    <a class="fw-bold text-decoration-none fs-5" href="/" style="color: var(--akima-brown);">Akima</a>
</nav>

{% if messages %}
<div class="container mt-2">
    {% for message in messages %}
    <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
        {{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    {% endfor %}
</div>
{% endif %}

<main class="d-flex align-items-center justify-content-center py-5">
    <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5" style="width: 100%; max-width: 440px;">

        <div class="text-center mb-4">
            <h4 class="fw-bold mb-1" style="color: var(--akima-brown);">Bienvenida de nuevo</h4>
            <p class="text-muted small mb-0">Inicia sesión en tu cuenta de Akima</p>
        </div>

        <form method="POST">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label fw-semibold small">Correo electrónico</label>
                <input type="email" name="email" value="{{ email }}"
                       class="form-control rounded-3"
                       placeholder="tu@correo.com" required autofocus>
            </div>

            <div class="mb-4">
                <label class="form-label fw-semibold small">Contraseña</label>
                <div class="input-group">
                    <input type="password" name="password" id="passwordInput"
                           class="form-control rounded-start-3"
                           placeholder="••••••••" required>
                    <button type="button" class="btn btn-outline-secondary rounded-end-3"
                            onclick="togglePassword()">
                        <i class="bi bi-eye" id="eyeIcon"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn btn-akima w-100 py-2 mb-3">
                Iniciar sesión
            </button>

            <p class="text-center text-muted small mb-0">
                ¿No tienes cuenta?
                <a href="{% url 'register' %}" style="color: var(--akima-brown); font-weight: 600;">
                    Regístrate aquí
                </a>
            </p>
        </form>
    </div>
</main>

<footer class="py-3 text-center text-white" style="background-color: var(--akima-brown);">
    <p class="small mb-0" style="opacity: 0.8;">© 2024 Akima · Ropa hecha con amor</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
function togglePassword() {
    const input = document.getElementById('passwordInput');
    const icon  = document.getElementById('eyeIcon');
    if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'bi bi-eye-slash';
    } else {
        input.type = 'password';
        icon.className = 'bi bi-eye';
    }
}
</script>
</body>
</html>
