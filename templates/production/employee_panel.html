{% extends 'shared/header_employee.html' %}
{% block title %}Panel Empleada - Akima{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">
        <div>
            <h3 class="fw-bold mb-1" style="color: var(--akima-brown);">Mis asignaciones</h3>
            <p class="text-muted mb-0">Consulta los productos y pedidos que tienes asignados.</p>
        </div>
    </div>



    {% if tasks %}
        <!-- aquí va el mismo loop de tareas que ya tienes -->
    {% else %}
        <div class="card border-0 shadow-sm rounded-4 p-4">
            <p class="text-muted mb-0">No tienes tareas asignadas actualmente.</p>
        </div>
    {% endif %}
</div>
{% endblock %}
