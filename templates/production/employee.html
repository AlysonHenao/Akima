{% extends 'shared/header_employee.html' %}
{% block title %}Panel Employee - Akima{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="text-center mb-5">
        <h4 class="fw-bold mb-0">Panel de Empleada</h4>
        <p class="text-muted small">Gestiona tus tareas y asignaciones</p>
    </div>

    <div class="row justify-content-center g-4">
        <div class="col-md-4">
            <a href="{% url 'employee_panel' %}" class="text-decoration-none">
                <div class="card border-0 shadow-sm rounded-4 text-center p-4 h-100">
                    <i class="bi bi-box-seam fs-1 mb-3" style="color: var(--akima-brown);"></i>
                    <h5 class="fw-bold">Asignaciones</h5>
                    <p class="text-muted small">Ver y gestionar tus asignaciones</p>
                </div>
            </a>
        </div>
    </div>
</div>
{% endblock %}
