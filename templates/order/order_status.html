<!DOCTYPE html>
<html>
<head>
    <title>Estado de pedidos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
<div class="container mt-4">

    <h2 class="mb-4">Estado de los pedidos</h2>

    <table class="table table-striped">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Usuario</th>
                <th>Fecha</th>
                <th>Total</th>
                <th>Estado</th>
            </tr>
        </thead>

        <tbody>
            {% for order in orders %}
            <tr>
                <td>#{{ order.id }}</td>
                <td>{{ order.user }}</td>
                <td>{{ order.order_date }}</td>
                <td>{{ order.formatted_price }}</td>
                <td>
                    <span class="badge rounded-pill px-3 py-2 {{ order.status|status_badge_class }}">{{ order.status }}</span>
                </td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="5" class="text-center">No hay pedidos</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

</div>
</body>
</html>
